name: Hide events

# The published app cannot write to the repository, so its "hide all Zavrnjeno"
# button hands a list of event IDs to GitHub in one of two ways. With a token
# stored on the device it starts this workflow through the API and passes the
# list as the `ids` input. Without a token it opens the GitHub editor on a file
# in inbox/hide/, and committing that file starts this workflow through the push
# trigger. Either way each event is hidden by its exact ID with
# scripts/hide_event.py and the site is republished. Each ID is hidden on its own,
# never as a series or a venue.
#
# The dispatch route is guarded by the device's token, which can start workflows
# and nothing else. The input is untrusted text. It is read from the
# environment, never pasted into a script, and scripts/dispatch_input.py keeps
# only lines that are a single ID.

on:
  push:
    branches: [main]
    paths:
      - inbox/hide/*.txt
  workflow_dispatch:
    inputs:
      ids:
        description: "Event IDs to hide, one per line"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hide-events
  cancel-in-progress: false

jobs:
  hide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip rather than the triggering commit, so a queued run
          # hides against the database the run before it already wrote.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the dispatched list
        if: github.event_name == 'workflow_dispatch'
        env:
          PATCH: ${{ inputs.ids }}
        # Written outside the checkout, so a reset to the fresh tip keeps it.
        run: python3 scripts/dispatch_input.py hide --out "$RUNNER_TEMP/dispatch-hide.txt"

      - name: Hide every listed event
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged="$RUNNER_TEMP/dispatch-hide.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            files=(inbox/hide/*.txt)
            if [ -f "$staged" ]; then
              files+=("$staged")
            fi
            if [ ${#files[@]} -eq 0 ]; then
              echo "There is no list to hide."
              exit 0
            fi
            for file in "${files[@]}"; do
              echo "::group::$file"
              cat "$file"
              python3 scripts/hide_event.py apply "$file" --reason "hidden from the app"
              echo "::endgroup::"
              if [ "$file" != "$staged" ]; then
                rm "$file"
              fi
            done
            python3 scripts/run.py check
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "chore: Hide events from the app"
            if git push; then
              exit 0
            fi
            # A rejected push means another run landed first. A database
            # conflict is never merged as text. Start again from the fresh
            # tip, where the lists are still in the inbox, and hide again.
            echo "Push rejected on attempt $attempt. Hiding again from the fresh database."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::Could not push after 3 attempts. The lists stay in the inbox."
          exit 1

  publish:
    needs: hide
    uses: ./.github/workflows/pages.yml
