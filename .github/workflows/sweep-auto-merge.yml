name: Auto fast-forward sweep branches to main

# The scheduled discovery routine runs in an isolated Claude Code session that is
# assigned a fresh claude/* branch each time and is not permitted to push straight
# to main from inside that session (see routine.md section 5 and AGENTS.md). This
# workflow is the human-free way to finish publishing a sweep: it watches every
# push to a claude/* branch and fast-forwards main onto it, but ONLY when the push
# is provably nothing but sweep output. Any branch that fails a guardrail is left
# alone for a human to review and merge by hand - this workflow never force-pushes,
# never creates a merge commit, and never bypasses branch protection.
#
# Guardrails (all must pass, or nothing is pushed):
#   1. main must be a strict ancestor of the branch tip (fast-forward only).
#   2. Every commit ahead of main must have the exact commit message
#      "chore: Routine sweep YYYY-MM-DD" that AGENTS.md mandates for a sweep.
#   3. The full diff from main may only touch db.json, diff.md and runs/*.json,
#      the exact files a sweep is allowed to write. Any other changed file (code,
#      reference docs, scripts, workflows, anything else) blocks the merge. This
#      is what stops the workflow from ever auto-landing an unrelated Claude
#      session's work just because its branch happens to match claude/*.
#   4. scripts/run.py check must pass against the branch's own database before
#      it is allowed anywhere near main.
# If branch protection on main requires review, the final push simply fails with
# a normal error - this workflow never attempts to work around that.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sweep-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      merged: ${{ steps.push.outputs.merged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Guardrails - fast-forward, sweep-only commits, sweep-only paths
        id: guard
        run: |
          set -euo pipefail
          git fetch origin main

          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
            echo "Branch is already level with main. Nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::warning::main has diverged from this branch - not a fast-forward. Skipping auto-merge; a human needs to reconcile this by hand."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bad=0
          for sha in $(git rev-list origin/main..HEAD); do
            msg="$(git log -1 --format=%s "$sha")"
            if ! echo "$msg" | grep -Eq '^chore: Routine sweep [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::warning::Commit $sha is not a sweep commit (\"$msg\"). Skipping auto-merge; a human needs to review and merge this branch by hand."
              bad=1
            fi
          done
          if [ "$bad" = "1" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              db.json|diff.md|runs/*.json) ;;
              *)
                echo "::warning::Disallowed file changed outside the sweep's own output: $f. Skipping auto-merge; a human needs to review and merge this branch by hand."
                bad=1
                ;;
            esac
          done < <(git diff --name-only origin/main..HEAD)
          if [ "$bad" = "1" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Re-validate the sweep's database and report
        if: steps.guard.outputs.ok == 'true'
        run: python3 scripts/run.py check

      - name: Fast-forward main
        id: push
        if: steps.guard.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "merged=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/pages.yml
